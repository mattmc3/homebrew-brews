name: Update Formulas

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula name (without .rb, or leave empty for all formulas)'
        required: false
        default: ''
      version:
        description: 'Version tag (optional, e.g., v1.0.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-formulas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v7

      - name: Update formulas
        id: bump
        uses: mattmc3/brew-bumper@v1
        with:
          formula: ${{ inputs.formula }}
          version: ${{ inputs.version }}
          commit: 'true'

      - name: Push changes
        if: steps.bump.outputs.changed == 'true'
        run: git push
